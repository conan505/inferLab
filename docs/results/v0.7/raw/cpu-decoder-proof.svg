<circle class="token" cx="1148.0" cy="622" r="7"/>
<text x="1148.0" y="582.0" class="label" text-anchor="middle">.</text>
<text x="1148.0" y="598.0" class="small" text-anchor="middle">+83.5 ms</text>
<text x="66.0" y="696.0" class="small" text-anchor="start">client receives</text>
