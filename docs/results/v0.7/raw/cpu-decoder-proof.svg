<text x="816.0" y="132.0" class="heading" text-anchor="start">Median full generation latency</text>
<text x="816.0" y="153.0" class="small" text-anchor="start">Eight decoding steps · warm single-process runs</text>
<text x="816.0" y="215.0" class="label" text-anchor="start">C++ loops</text>
<rect class="cpp" x="816" y="229" width="29.8" height="30" rx="4"/>
<text x="855.8" y="250.0" class="value" text-anchor="start">50.2 µs</text>
<text x="816.0" y="320.0" class="label" text-anchor="start">PyTorch oracle</text>
<rect class="torch" x="816" y="334" width="260.0" height="30" rx="4"/>
<text x="1086.0" y="355.0" class="value" text-anchor="start">438.2 µs</text>
<text x="816.0" y="418.0" class="small" text-anchor="start">Educational micro-model: latency is not a production throughput claim.</text>
<rect class="panel" x="42" y="480" width="1156" height="230" rx="10"/>
<text x="66.0" y="514.0" class="heading" text-anchor="start">Real SSE token timeline through the Rust gateway</text>
<text x="66.0" y="536.0" class="small" text-anchor="start">Injected 12 ms pacing · observed stream span 83.462 ms</text>
<line class="timeline" x1="94" y1="622" x2="1148" y2="622"/>
<circle class="token" cx="94.0" cy="622" r="7"/>
<text x="94.0" y="582.0" class="label" text-anchor="middle">InferLab</text>
<text x="94.0" y="598.0" class="small" text-anchor="middle">+0.0 ms</text>
<circle class="token" cx="271.4" cy="622" r="7"/>
