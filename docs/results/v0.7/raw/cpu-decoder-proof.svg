<circle class="dot-c" cx="742.0" cy="381.0" r="4"/>
<text x="536.0" y="432.0" class="small" text-anchor="start">hello systems · max 3.18e-06</text>
<text x="92.0" y="418.0" class="small" text-anchor="middle">1</text>
<text x="184.9" y="418.0" class="small" text-anchor="middle">2</text>
