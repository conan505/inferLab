<text x="321.0" y="432.0" class="small" text-anchor="start">why does inference matter · max 1.97e-06</text>
<path class="series-c" d="M 92.0 346.6 L 184.9 325.9 L 277.7 308.8 L 370.6 300.2 L 463.4 289.8 L 556.3 353.4 L 649.1 308.1 L 742.0 381.0"/>
