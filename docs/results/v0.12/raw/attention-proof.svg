<text x="830.0" y="171.0" class="label" text-anchor="start">online tiled</text>
<text x="946.5" y="511.0" class="small" text-anchor="middle">sequence tokens</text>
<text x="674.0" y="526.0" class="value" text-anchor="start">At 256 tokens: 2.0× less modeled traffic (4.5 → 2.25 MiB).</text>
<text x="66.0" y="624.0" class="heading" text-anchor="start">Measured scalar CPU wall time</text>
<text x="66.0" y="645.0" class="small" text-anchor="start">Median microseconds · observational, host-specific</text>
