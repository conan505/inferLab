<text x="221.0" y="171.0" class="label" text-anchor="start">online tiled</text>
<text x="337.5" y="511.0" class="small" text-anchor="middle">sequence tokens</text>
<text x="66.0" y="526.0" class="value" text-anchor="start">At 256 tokens: 8,192× less score scratch (1 MiB → 128 B).</text>
<text x="674.0" y="130.0" class="heading" text-anchor="start">Modeled external traffic</text>
<text x="674.0" y="151.0" class="small" text-anchor="start">MiB moved by the algorithmic byte model, not hardware counters</text>
