<text x="221.0" y="665.0" class="label" text-anchor="start">online tiled</text>
<text x="337.5" y="1005.0" class="small" text-anchor="middle">sequence tokens</text>
<text x="66.0" y="1020.0" class="value" text-anchor="start">Observed 256-token speedup: 2.24×; no GPU claim is made.</text>
<text x="674.0" y="624.0" class="heading" text-anchor="start">Storage precision drift from FP32</text>
<text x="674.0" y="645.0" class="small" text-anchor="start">Maximum absolute fixture output error · FP32 accumulation</text>
<text x="704.0" y="724.0" class="label" text-anchor="start">FP32</text>
<rect class="blue-fill" x="736.0" y="704.0" width="0.0" height="30.0" rx="3"/>
<text x="744.0" y="724.0" class="value" text-anchor="start">0.0000001</text>
<text x="704.0" y="800.0" class="label" text-anchor="start">FP16</text>
<rect class="orange-fill" x="736.0" y="780.0" width="38.4" height="30.0" rx="3"/>
<text x="782.4" y="800.0" class="value" text-anchor="start">0.0001991</text>
<text x="704.0" y="876.0" class="label" text-anchor="start">BF16</text>
<rect class="purple-fill" x="736.0" y="856.0" width="375.0" height="30.0" rx="3"/>
<text x="1119.0" y="876.0" class="value" text-anchor="start">0.0019461</text>
<text x="674.0" y="956.0" class="value" text-anchor="start">Maximum C++ ↔ PyTorch oracle error: 1.16e-07</text>
<text x="674.0" y="978.0" class="value" text-anchor="start">Maximum online ↔ materialized error: 1.00e-07</text>
<text x="674.0" y="1000.0" class="small" text-anchor="start">FP16/BF16 are storage simulations here, not accelerator throughput modes.</text>
<text x="50.0" y="1090.0" class="subtitle" text-anchor="start">Boundary: exact causal algorithm and byte model on CPU now; CUDA kernel, shared-memory tiling, and profiler counters remain v1.0.</text>
</svg>
