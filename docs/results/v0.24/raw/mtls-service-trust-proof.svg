<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">InferLab v0.24 mutual-TLS trust distribution proof</title><desc id="desc">TLS 1.3 mutual authentication protects the trust-distributor channel. 5 of 5 transport attacks fail before HTTP and 2 of 2 application attacks receive the expected signature rejection; generation two converges with three receipts, a receiver restarts from cache during distributor outage, and real JSON and SSE inference continue.</desc><style>
          .bg{fill:#f8fafc}.channel{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.safe{fill:#ecfdf5;stroke:#059669;stroke-width:1.5}.attack{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}.outage{fill:#f1f5f9;stroke:#64748b;stroke-width:1.5}.proof{fill:#ecfdf5;stroke:#059669;stroke-width:1.5}.line{stroke:#64748b;stroke-width:2;fill:none}.dash{stroke-dasharray:7 5}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:750}.subtitle{font-size:15px;fill:#475569}.section{font-size:18px;font-weight:700}.card-title{font-size:15px;font-weight:700}.card-value{font-size:21px;font-weight:750}.card-detail{font-size:12px;fill:#475569}.edge{font-size:12px;fill:#64748b}.proof-value{font-size:24px;font-weight:750;fill:#047857}.proof-detail{font-size:13px;fill:#065f46}.foot{font-size:12px;fill:#64748b}
        </style><rect width="1200" height="850" class="bg"/><text x="50" y="54" class="title" text-anchor="start">v0.24 · TLS 1.3 mutual authentication for trust distribution</text><text x="50" y="84" class="subtitle" text-anchor="start">TLSv1.3 · server SAN localhost · client certificate required · application signatures remain authoritative</text><text x="50" y="132" class="section" text-anchor="start">Authenticated channel and independently authorized policy</text><rect x="50" y="165" width="245" height="125" rx="14" class="safe"/><text x="172" y="196" class="card-title" text-anchor="middle">trust-root signer</text><text x="172" y="235" class="card-value" text-anchor="middle">root-signed g1</text><text x="172" y="266" class="card-detail" text-anchor="middle">authorizes policy meaning</text><rect x="345" y="165" width="245" height="125" rx="14" class="channel"/><text x="467" y="196" class="card-title" text-anchor="middle">mTLS distributor</text><text x="467" y="235" class="card-value" text-anchor="middle">TLSv1.3</text><text x="467" y="266" class="card-detail" text-anchor="middle">server + client identity</text><rect x="640" y="165" width="245" height="125" rx="14" class="safe"/><text x="762" y="196" class="card-title" text-anchor="middle">three controls</text><text x="762" y="235" class="card-value" text-anchor="middle">3 / 3 receipts</text><text x="762" y="266" class="card-detail" text-anchor="middle">verify · persist · activate</text><rect x="935" y="165" width="215" height="125" rx="14" class="attack"/><text x="1042" y="196" class="card-title" text-anchor="middle">transport attacks</text><text x="1042" y="235" class="card-value" text-anchor="middle">5 / 5 fail</text><text x="1042" y="266" class="card-detail" text-anchor="middle">before HTTP response</text><line x1="295" y1="227" x2="345" y2="227" class="line"/><text x="320" y="214" class="edge" text-anchor="middle">signed bytes</text><line x1="590" y1="227" x2="640" y2="227" class="line"/><text x="615" y="214" class="edge" text-anchor="middle">mTLS</text><line x1="935" y1="227" x2="885" y2="227" class="line dash"/><text x="910" y="214" class="edge" text-anchor="middle">blocked</text><text x="50" y="345" class="section" text-anchor="start">Safety and recovery timeline</text><rect x="50" y="380" width="250" height="125" rx="14" class="attack"/><text x="175" y="411" class="card-title" text-anchor="middle">application attacks</text><text x="175" y="450" class="card-value" text-anchor="middle">2 / 2 rejected</text><text x="175" y="481" class="card-detail" text-anchor="middle">tampered snapshot · forged receipt</text><rect x="350" y="380" width="250" height="125" rx="14" class="safe"/><text x="475" y="411" class="card-title" text-anchor="middle">valid generation 2</text><text x="475" y="450" class="card-value" text-anchor="middle">3 / 3 receipts</text><text x="475" y="481" class="card-detail" text-anchor="middle">status observation 16.011 ms</text><rect x="650" y="380" width="250" height="125" rx="14" class="outage"/><text x="775" y="411" class="card-title" text-anchor="middle">distributor outage</text><text x="775" y="450" class="card-value" text-anchor="middle">cache bootstrap</text><text x="775" y="481" class="card-detail" text-anchor="middle">PID 52261 → 52368</text><rect x="950" y="380" width="200" height="125" rx="14" class="safe"/><text x="1050" y="411" class="card-title" text-anchor="middle">real inference</text><text x="1050" y="450" class="card-value" text-anchor="middle">JSON + SSE</text><text x="1050" y="481" class="card-detail" text-anchor="middle">SSE reaches [DONE]</text><line x1="300" y1="442" x2="350" y2="442" class="line"/><line x1="600" y1="442" x2="650" y2="442" class="line"/><line x1="900" y1="442" x2="950" y2="442" class="line"/><rect x="50" y="565" width="1100" height="155" rx="16" class="proof"/><text x="600" y="612" class="proof-value" text-anchor="middle">31 / 31 checks passed</text><text x="600" y="651" class="proof-detail" text-anchor="middle">real JSON 194.266 ms · SSE 190.227 ms + [DONE]</text><text x="600" y="683" class="proof-detail" text-anchor="middle">TLS authenticates the channel; Ed25519 root/service signatures still authorize policy and receipts</text><text x="50" y="778" class="foot" text-anchor="start">Limits: trust-distribution link only; ephemeral proof CA; no global service mTLS, certificate rotation/revocation, ACME/HSM, policy expiry, or distributor HA.</text><text x="50" y="807" class="foot" text-anchor="start">All endpoints are loopback; private keys and certificate PEM are excluded from retained evidence.</text></svg>