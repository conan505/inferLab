<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; }
    .muted { fill: #94a3b8; font-size: 13px; }
  </style>
  <text x="80" y="42" font-size="24" font-weight="700">InferLab v0.0.8 — circuit recovery</text>
  <text x="80" y="72" class="muted">sliding window → cooldown → one controlled probe → automatic re-entry</text>
  <line x1="270" y1="181" x2="322" y2="181" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="520" y1="181" x2="572" y2="181" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="770" y1="181" x2="822" y2="181" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="80" y="135" width="190" height="92" rx="14" fill="#111c33" stroke="#38bdf8" stroke-width="3"/>
  <text x="175" y="173" text-anchor="middle" font-size="20" font-weight="700" fill="#38bdf8">closed</text>
  <text x="175" y="202" text-anchor="middle" class="muted">4 failures</text>
  <rect x="330" y="135" width="190" height="92" rx="14" fill="#111c33" stroke="#fb7185" stroke-width="3"/>
  <text x="425" y="173" text-anchor="middle" font-size="20" font-weight="700" fill="#fb7185">open</text>
  <text x="425" y="202" text-anchor="middle" class="muted">2 routes skipped</text>
  <rect x="580" y="135" width="190" height="92" rx="14" fill="#111c33" stroke="#fbbf24" stroke-width="3"/>
  <text x="675" y="173" text-anchor="middle" font-size="20" font-weight="700" fill="#fbbf24">half-open</text>
  <text x="675" y="202" text-anchor="middle" class="muted">1 probe</text>
  <rect x="830" y="135" width="190" height="92" rx="14" fill="#111c33" stroke="#4ade80" stroke-width="3"/>
  <text x="925" y="173" text-anchor="middle" font-size="20" font-weight="700" fill="#4ade80">closed</text>
  <text x="925" y="202" text-anchor="middle" class="muted">worker healed</text>
  <text x="80" y="288" class="muted">worker A openings</text>
  <text x="285" y="288" font-size="16">1</text>
  <text x="390" y="288" class="muted">half-open probes</text>
  <text x="610" y="288" font-size="16">1</text>
  <text x="705" y="288" class="muted">recoveries</text>
  <text x="870" y="288" font-size="16">1</text>
  <text x="80" y="335" class="muted">request accounting</text>
  <text x="285" y="335" font-size="16">17 attempts = 17 originals + 0 retries</text>
