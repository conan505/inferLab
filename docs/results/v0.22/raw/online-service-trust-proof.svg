        </style><rect width="1200" height="760" class="background"/><text x="50" y="54" class="title">v0.22 · signed online service-trust convergence</text><text x="50" y="82" class="subtitle">Initial leader node-a · authenticated generations · durable rollback floor · loopback evidence</text><text x="50" y="122" class="section">Last-known-good receiver policy over time</text><rect x="50" y="160" width="250" height="175" rx="12" class="bootstrap"/><text x="175" y="193" class="stage-title">1 · bootstrap g1</text><text x="175" y="235" class="stage-value">gateway A</text><text x="175" y="270" class="stage-detail">root signature verified</text><text x="175" y="310" class="stage-foot">route revision 2 retained</text><line x1="300" y1="247" x2="350" y2="247" class="arrow" marker-end="url(#arrow)"/><text x="325" y="232" class="edge-label">signed g2</text><rect x="350" y="160" width="250" height="175" rx="12" class="overlap"/><text x="475" y="193" class="stage-title">2 · overlap g2</text><text x="475" y="235" class="stage-value">gateway A + B</text><text x="475" y="270" class="stage-detail">online ≤ 5.0 ms</text><text x="475" y="310" class="stage-foot">route revision 2 retained</text><line x1="600" y1="247" x2="650" y2="247" class="arrow" marker-end="url(#arrow)"/><text x="625" y="232" class="edge-label">signed g3</text><rect x="650" y="160" width="250" height="175" rx="12" class="active"/><text x="775" y="193" class="stage-title">3 · revoke g3</text><text x="775" y="235" class="stage-value">reject A · accept B</text><text x="775" y="270" class="stage-detail">online ≤ 4.9 ms</text><text x="775" y="310" class="stage-foot">route revision 2 retained</text><line x1="900" y1="247" x2="950" y2="247" class="arrow" marker-end="url(#arrow)"/><text x="925" y="232" class="edge-label">bad input</text><rect x="950" y="160" width="250" height="175" rx="12" class="rejected"/><text x="1075" y="193" class="stage-title">4 · retain g3</text><text x="1075" y="235" class="stage-value">rollback + tamper</text><text x="1075" y="270" class="stage-detail">both rejected</text><text x="1075" y="310" class="stage-foot">route revision 2 retained</text><text x="50" y="390" class="section">Observed convergence and fences</text><rect x="50" y="418" width="250" height="112" rx="12" class="metric"/><text x="175" y="451" class="metric-label">control process continuity</text><text x="175" y="489" class="metric-value">3 / 3 unchanged</text><text x="175" y="514" class="metric-label">true</text><rect x="325" y="418" width="250" height="112" rx="12" class="metric"/><text x="450" y="451" class="metric-label">online generation reloads</text><text x="450" y="489" class="metric-value">g1 → g2 → g3</text><text x="450" y="514" class="metric-label">no control restart</text><rect x="600" y="418" width="250" height="112" rx="12" class="metric"/><text x="725" y="451" class="metric-label">policy rejection observations</text><text x="725" y="489" class="metric-value">3 → 6</text><text x="725" y="514" class="metric-label">rollback then signature failure</text><rect x="875" y="418" width="275" height="112" rx="12" class="metric"/><text x="1012" y="451" class="metric-label">restart rollback fence</text><text x="1012" y="489" class="metric-value">blocked</text><text x="1012" y="514" class="metric-label">exit 1 · durable floor 3</text><rect x="50" y="575" width="1100" height="112" rx="14" class="proof"/><text x="600" y="615" class="proof-title">20 / 20 checks passed</text><text x="600" y="647" class="proof-detail">gateway key-b served request in 189.236 ms · SSE in 187.796 ms + DONE</text><text x="600" y="674" class="proof-detail">Signed policy generation 3 and route revision 2 survive invalid live input and process restart</text><text x="50" y="730" class="foot">Operational limit: policy files and rollback floors depend on local filesystem integrity; root keys and private service signers remain static configuration.</text></svg>