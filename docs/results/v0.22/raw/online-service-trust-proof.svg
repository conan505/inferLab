<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">InferLab v0.22 signed online service-trust proof</title><desc id="desc">A four-stage timeline shows root-signed generation 1, online trust expansion generation 2, online revocation generation 3, and rejection of rollback and tampered snapshots while route revision 2 remains active.</desc><defs>
