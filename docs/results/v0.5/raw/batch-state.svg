<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; }
    .muted { fill: #94a3b8; font-size: 13px; }
    .event { fill: #cbd5e1; font-size: 11px; }
    .metric { fill: #e2e8f0; font-size: 15px; }
  </style>
  <text x="55" y="38" font-size="24" font-weight="700">InferLab v0.5 — durable batch lifecycle</text>
  <text x="55" y="64" class="muted">Each dot is one fsync-backed WAL transition; horizontal position is WAL order.</text>
  <line x1="375.0" y1="100" x2="375.0" y2="630" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="383.0" y="118" fill="#c4b5fd" font-size="13">queue process killed + restarted</text>
  <line x1="185" y1="230" x2="337" y2="230" stroke="#64748b" stroke-width="3"/><line x1="337" y1="230" x2="413" y2="230" stroke="#64748b" stroke-width="3"/><line x1="413" y1="230" x2="489" y2="230" stroke="#64748b" stroke-width="3"/><line x1="489" y1="230" x2="565" y2="230" stroke="#64748b" stroke-width="3"/><line x1="261" y1="390" x2="641" y2="390" stroke="#64748b" stroke-width="3"/><line x1="641" y1="390" x2="717" y2="390" stroke="#64748b" stroke-width="3"/><line x1="793" y1="550" x2="869" y2="550" stroke="#64748b" stroke-width="3"/><line x1="869" y1="550" x2="945" y2="550" stroke="#64748b" stroke-width="3"/><line x1="945" y1="550" x2="1021" y2="550" stroke="#64748b" stroke-width="3"/><line x1="1021" y1="550" x2="1097" y2="550" stroke="#64748b" stroke-width="3"/>
  <text x="55" y="235" class="metric">crashed consumer → redelivery</text>
  <text x="55" y="395" class="metric">pending across restart</text>
  <text x="55" y="555" class="metric">bounded failures → DLQ</text>
  <circle cx="185" cy="230" r="13" fill="#60a5fa"/><text x="185" y="262" text-anchor="middle" class="event">pending</text><circle cx="261" cy="390" r="13" fill="#60a5fa"/><text x="261" y="422" text-anchor="middle" class="event">pending</text><circle cx="337" cy="230" r="13" fill="#fbbf24"/><text x="337" y="262" text-anchor="middle" class="event">claim #1</text><circle cx="413" cy="230" r="13" fill="#fb923c"/><text x="413" y="262" text-anchor="middle" class="event">timeout</text><circle cx="489" cy="230" r="13" fill="#fbbf24"/><text x="489" y="262" text-anchor="middle" class="event">claim #2</text><circle cx="565" cy="230" r="13" fill="#4ade80"/><text x="565" y="262" text-anchor="middle" class="event">completed</text><circle cx="641" cy="390" r="13" fill="#fbbf24"/><text x="641" y="422" text-anchor="middle" class="event">claim #1</text><circle cx="717" cy="390" r="13" fill="#4ade80"/><text x="717" y="422" text-anchor="middle" class="event">completed</text><circle cx="793" cy="550" r="13" fill="#60a5fa"/><text x="793" y="582" text-anchor="middle" class="event">pending</text><circle cx="869" cy="550" r="13" fill="#fbbf24"/><text x="869" y="582" text-anchor="middle" class="event">claim #1</text><circle cx="945" cy="550" r="13" fill="#fb923c"/><text x="945" y="582" text-anchor="middle" class="event">pending</text><circle cx="1021" cy="550" r="13" fill="#fbbf24"/><text x="1021" y="582" text-anchor="middle" class="event">claim #2</text><circle cx="1097" cy="550" r="13" fill="#fb7185"/><text x="1097" y="582" text-anchor="middle" class="event">dead letter</text>
  <text x="55" y="650" class="metric">Final: 2 completed · 1 dead letter · 0 pending · 0 claimed</text>
  <text x="55" y="680" class="muted">Blue pending · yellow claim · orange release/timeout · green completion · red dead letter</text>
</svg>
