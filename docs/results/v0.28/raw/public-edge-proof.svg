<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">InferLab v0.28 public edge isolation proof</title>
<desc id="desc">InferLab v0.28 public-edge proof: 29 assertions pass; missing authentication plus both credential classes see the same absent internal route on the public listener; eighteen finite hosted-gate rejections produce zero hidden compute attempts; two independent request buckets, real CPU JSON and incremental terminal SSE, and disconnect permit cleanup are proven with two stable processes.</desc>
