        </style><rect width="1200" height="820" class="background"/><text x="50" y="54" class="title" text-anchor="start">v0.23 · distributed signed trust and activation receipts</text><text x="50" y="83" class="subtitle" text-anchor="start">Remote g1 boot ≤ 9.0 ms observed · root authority separate from transport · exact loopback partition</text><text x="50" y="130" class="section" text-anchor="start">Publication and convergence timeline</text><rect x="50" y="180" width="250" height="160" rx="14" class="authority"/><text x="175" y="215" class="panel-title" text-anchor="middle">1 · remote g1 boot</text><text x="175" y="260" class="panel-value" text-anchor="middle">3 / 3 receipts</text><text x="175" y="298" class="panel-detail" text-anchor="middle">root-signed policy</text><line x1="300" y1="260" x2="350" y2="260" class="arrow" marker-end="url(#arrow)"/><text x="325" y="246" class="edge" text-anchor="middle">publish overlap g2</text><rect x="350" y="180" width="250" height="160" rx="14" class="partial"/><text x="475" y="215" class="panel-title" text-anchor="middle">2 · C withheld</text><text x="475" y="260" class="panel-value" text-anchor="middle">2 ack · 1 pending</text><text x="475" y="298" class="panel-detail" text-anchor="middle">A + B active · C on g1</text><line x1="600" y1="260" x2="650" y2="260" class="arrow" marker-end="url(#arrow)"/><text x="625" y="246" class="edge" text-anchor="middle">heal partition</text><rect x="650" y="180" width="250" height="160" rx="14" class="converged"/><text x="775" y="215" class="panel-title" text-anchor="middle">3 · controls reach g2</text><text x="775" y="260" class="panel-value" text-anchor="middle">controls 12.547 ms</text><text x="775" y="298" class="panel-detail" text-anchor="middle">then 3 / 3 receipts</text><line x1="900" y1="260" x2="950" y2="260" class="arrow" marker-end="url(#arrow)"/><text x="925" y="246" class="edge" text-anchor="middle">rotate B · g3</text><rect x="950" y="180" width="250" height="160" rx="14" class="converged"/><text x="1075" y="215" class="panel-title" text-anchor="middle">4 · controls reach g3</text><text x="1075" y="260" class="panel-value" text-anchor="middle">controls 22.872 ms</text><text x="1075" y="298" class="panel-detail" text-anchor="middle">then 3 / 3 receipts</text><text x="50" y="390" class="section" text-anchor="start">Safety attacks and outage recovery</text><rect x="50" y="420" width="250" height="112" rx="12" class="metric"/><text x="175" y="454" class="metric-label" text-anchor="middle">valid rollback g2</text><text x="175" y="491" class="metric-value" text-anchor="middle">HTTP 409</text><text x="175" y="516" class="metric-label" text-anchor="middle">current g3 unchanged</text><rect x="325" y="420" width="250" height="112" rx="12" class="metric"/><text x="450" y="454" class="metric-label" text-anchor="middle">different valid g3 fork</text><text x="450" y="491" class="metric-value" text-anchor="middle">HTTP 409</text><text x="450" y="516" class="metric-label" text-anchor="middle">snapshot identity fenced</text><rect x="600" y="420" width="250" height="112" rx="12" class="metric"/><text x="725" y="454" class="metric-label" text-anchor="middle">tampered higher bytes</text><text x="725" y="491" class="metric-value" text-anchor="middle">HTTP 400</text><text x="725" y="516" class="metric-label" text-anchor="middle">root signature rejected</text><rect x="875" y="420" width="275" height="112" rx="12" class="outage"/><text x="1012" y="454" class="metric-label" text-anchor="middle">distributor outage restart</text><text x="1012" y="491" class="metric-value" text-anchor="middle">cached g3</text><text x="1012" y="516" class="metric-label" text-anchor="middle">PID 27496 → 27667</text><rect x="50" y="580" width="1100" height="145" rx="14" class="proof"/><text x="600" y="625" class="proof-title" text-anchor="middle">25 / 25 checks passed</text><text x="600" y="661" class="proof-detail" text-anchor="middle">gateway B real request 186.075 ms · SSE 187.935 ms + DONE</text><text x="600" y="692" class="proof-detail" text-anchor="middle">publish → verify → persist cache/floor → activate → signed receipt</text><text x="50" y="775" class="foot" text-anchor="start">Limits: one distributor, eventual per-receiver convergence, ambiguous missing receipts, trusted local disk/key custody, and no TLS/mTLS or multi-host evidence.</text></svg>