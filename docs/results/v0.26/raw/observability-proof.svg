<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">InferLab v0.26 bounded-cardinality Prometheus observability proof</title><desc id="desc">InferLab v0.26 checked 9 metrics targets across 6 service classes. Peak series were 159 per target and 1047 across the topology, below caps 256 and 2500. Closed catalogs bound the same topology to 1721 theoretical series. All 165 histogram label sets satisfy the fixed-bucket algebra; 24 unique prompts created no new gateway or worker series. A request ID survived gateway to CPU worker and a retry, invalid input was replaced, and real JSON plus SSE ending in DONE succeeded. All 36 checker assertions passed.</desc><style>
          .bg{fill:#f8fafc}.target{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.bounded{fill:#ecfdf5;stroke:#059669;stroke-width:1.5}.identity{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}.delta{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}.proof{fill:#ecfdf5;stroke:#059669;stroke-width:1.5}.line{stroke:#64748b;stroke-width:2;fill:none}.arrow{fill:#64748b}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:750}.subtitle{font-size:15px;fill:#475569}.section{font-size:18px;font-weight:700}.card-title{font-size:14px;font-weight:700}.card-value{font-size:21px;font-weight:750}.card-detail{font-size:12px;fill:#475569}.edge{font-size:12px;fill:#64748b}.proof-value{font-size:24px;font-weight:750;fill:#047857}.proof-detail{font-size:13px;fill:#065f46}.foot{font-size:12px;fill:#64748b}
        </style><rect width="1200" height="940" class="bg"/><text x="50" y="54" class="title" text-anchor="start">v0.26 · Bounded-cardinality Prometheus observability</text><text x="50" y="84" class="subtitle" text-anchor="start">Separate loopback metrics listeners · raw OpenMetrics evidence · no request-derived labels</text><text x="50" y="128" class="section" text-anchor="start">Exact-process evidence topology</text><rect x="50" y="158" width="250" height="116" rx="14" class="target"/><text x="68" y="187" class="card-title" text-anchor="start">service classes</text><text x="68" y="223" class="card-value" text-anchor="start">6</text><text x="68" y="249" class="card-detail" text-anchor="start">9 scrape targets</text><rect x="350" y="158" width="250" height="116" rx="14" class="bounded"/><text x="368" y="187" class="card-title" text-anchor="start">target bound</text><text x="368" y="223" class="card-value" text-anchor="start">255 / 256</text><text x="368" y="249" class="card-detail" text-anchor="start">observed peak 159</text><rect x="650" y="158" width="250" height="116" rx="14" class="bounded"/><text x="668" y="187" class="card-title" text-anchor="start">topology bound</text><text x="668" y="223" class="card-value" text-anchor="start">1721 / 2500</text><text x="668" y="249" class="card-detail" text-anchor="start">observed peak 1047</text><rect x="950" y="158" width="200" height="116" rx="14" class="identity"/><text x="968" y="187" class="card-title" text-anchor="start">histograms</text><text x="968" y="223" class="card-value" text-anchor="start">165</text><text x="968" y="249" class="card-detail" text-anchor="start">label sets valid</text><text x="50" y="324" class="section" text-anchor="start">Cardinality and correlation invariants</text><rect x="50" y="354" width="250" height="116" rx="14" class="bounded"/><text x="68" y="383" class="card-title" text-anchor="start">unique prompts</text><text x="68" y="419" class="card-value" text-anchor="start">24</text><text x="68" y="445" class="card-detail" text-anchor="start">zero new gateway/worker series</text><rect x="350" y="354" width="250" height="116" rx="14" class="identity"/><text x="368" y="383" class="card-title" text-anchor="start">valid request ID</text><text x="368" y="419" class="card-value" text-anchor="start">preserved</text><text x="368" y="445" class="card-detail" text-anchor="start">client → gateway → CPU worker</text><rect x="650" y="354" width="250" height="116" rx="14" class="identity"/><text x="668" y="383" class="card-title" text-anchor="start">invalid request ID</text><text x="668" y="419" class="card-value" text-anchor="start">replaced once</text><text x="668" y="445" class="card-detail" text-anchor="start">not forwarded as request_id</text><rect x="950" y="354" width="200" height="116" rx="14" class="delta"/><text x="968" y="383" class="card-title" text-anchor="start">retry path</text><text x="968" y="419" class="card-value" text-anchor="start">1 → 2</text><text x="968" y="445" class="card-detail" text-anchor="start">one request, two attempts</text><line x1="570" y1="528" x2="880" y2="528" class="line"/><polygon points="880,528 868,521 868,535" class="arrow"/><text x="50" y="536" class="section" text-anchor="start">client</text><text x="240" y="536" class="section" text-anchor="start">gateway</text><text x="900" y="536" class="section" text-anchor="start">CPU worker</text><text x="560" y="512" class="edge" text-anchor="middle">same bounded request ID; never a metric label</text><line x1="105" y1="528" x2="215" y2="528" class="line"/><polygon points="215,528 203,521 203,535" class="arrow"/><line x1="300" y1="528" x2="570" y2="528" class="line"/><rect x="50" y="610" width="1100" height="172" rx="16" class="proof"/><text x="600" y="659" class="proof-value" text-anchor="middle">36 / 36 checks passed</text><text x="600" y="696" class="proof-detail" text-anchor="middle">9 exact owned service PIDs · 165 histogram label sets · all final in-flight gauges drained</text><text x="600" y="729" class="proof-detail" text-anchor="middle">real CPU JSON 156.298 ms · SSE 175.969 ms + [DONE]</text><text x="600" y="758" class="proof-detail" text-anchor="middle">exact deltas: retry requests 1 · attempts 2 · transient failures 1 · granted retries 1</text><text x="50" y="842" class="foot" text-anchor="start">Scope: controlled single-host proof and local Prometheus scrape demo; raw counters/gauges/histograms are cross-checked against service status.</text><text x="50" y="869" class="foot" text-anchor="start">No Grafana, OpenTelemetry, cloud backend, remote write, long-term retention, alert/SLO claim, or globally secured metrics transport.</text><text x="50" y="896" class="foot" text-anchor="start">Native paged-cache metrics are deferred: scrape-time allocator locking/page scans would put observability on the worker hot path.</text><text x="50" y="923" class="foot" text-anchor="start">Request IDs are bounded correlation fields in headers and JSON logs; prompts, IDs, worker identities, URLs, and error text are not labels.</text></svg>