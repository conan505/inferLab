<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">InferLab v0.25 directed Raft partition and Figure-8 proof</title><desc id="desc">A controlled three-process Raft cluster uses six directed loopback proxies. 4 links isolate old leader A while B and C commit index 4; healing makes A a follower and all three durable logs converge. The five-server Figure-8 replay passes 11 algorithmic checks, and real CPU JSON plus SSE ending in DONE succeed.</desc><style>
          .bg{fill:#f8fafc}.node{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.minority{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}.majority{fill:#ecfdf5;stroke:#059669;stroke-width:1.5}.model{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}.proof{fill:#ecfdf5;stroke:#059669;stroke-width:1.5}.line{stroke:#64748b;stroke-width:2;fill:none}.cut{stroke:#dc2626;stroke-width:3;stroke-dasharray:8 6}.heal{stroke:#059669;stroke-width:3}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:750}.subtitle{font-size:15px;fill:#475569}.section{font-size:18px;font-weight:700}.card-title{font-size:14px;font-weight:700}.card-value{font-size:21px;font-weight:750}.card-detail{font-size:12px;fill:#475569}.edge{font-size:12px;fill:#64748b}.proof-value{font-size:24px;font-weight:750;fill:#047857}.proof-detail{font-size:13px;fill:#065f46}.foot{font-size:12px;fill:#64748b}
        </style><rect width="1200" height="900" class="bg"/><text x="50" y="54" class="title" text-anchor="start">v0.25 · Directed Raft partition, suffix repair, and Figure 8</text><text x="50" y="84" class="subtitle" text-anchor="start">Three live OS processes + six Raft-only link proxies · five-server algorithmic replay is separate</text><text x="50" y="128" class="section" text-anchor="start">Controlled live schedule</text><rect x="50" y="160" width="250" height="116" rx="14" class="minority"/><text x="68" y="189" class="card-title" text-anchor="start">old leader A · term 1</text><text x="68" y="225" class="card-value" text-anchor="start">commit 2</text><text x="68" y="251" class="card-detail" text-anchor="start">uncommitted conflicting index 3</text><rect x="475" y="160" width="250" height="116" rx="14" class="majority"/><text x="493" y="189" class="card-title" text-anchor="start">connected majority B + C</text><text x="493" y="225" class="card-value" text-anchor="start">commit 4</text><text x="493" y="251" class="card-detail" text-anchor="start">term 2 no-op + different config</text><rect x="900" y="160" width="250" height="116" rx="14" class="node"/><text x="918" y="189" class="card-title" text-anchor="start">healed three-node cluster</text><text x="918" y="225" class="card-value" text-anchor="start">commit 4</text><text x="918" y="251" class="card-detail" text-anchor="start">identical durable logs</text><line x1="300" y1="218" x2="475" y2="218" class="cut"/><text x="388" y="203" class="edge" text-anchor="middle">4 directed drops</text><line x1="725" y1="218" x2="900" y2="218" class="heal"/><text x="812" y="203" class="edge" text-anchor="middle">heal → truncate + append</text><text x="50" y="340" class="section" text-anchor="start">Why counting old-term replicas is unsafe</text><rect x="50" y="375" width="250" height="116" rx="14" class="model"/><text x="68" y="404" class="card-title" text-anchor="start">Figure 8(c)</text><text x="68" y="440" class="card-value" text-anchor="start">3 / 5 copies</text><text x="68" y="466" class="card-detail" text-anchor="start">index 2 is from term 2</text><rect x="350" y="375" width="250" height="116" rx="14" class="minority"/><text x="368" y="404" class="card-title" text-anchor="start">naive count</text><text x="368" y="440" class="card-value" text-anchor="start">candidate 2</text><text x="368" y="466" class="card-detail" text-anchor="start">future S5 can overwrite it</text><rect x="650" y="375" width="250" height="116" rx="14" class="majority"/><text x="668" y="404" class="card-title" text-anchor="start">Raft current-term rule</text><text x="668" y="440" class="card-value" text-anchor="start">no candidate</text><text x="668" y="466" class="card-detail" text-anchor="start">leader is in term 4</text><rect x="950" y="375" width="200" height="116" rx="14" class="majority"/><text x="968" y="404" class="card-title" text-anchor="start">Figure 8(e)</text><text x="968" y="440" class="card-value" text-anchor="start">commit 3</text><text x="968" y="466" class="card-detail" text-anchor="start">prior index 2 follows</text><line x1="300" y1="433" x2="350" y2="433" class="line"/><line x1="600" y1="433" x2="650" y2="433" class="line"/><line x1="900" y1="433" x2="950" y2="433" class="line"/><rect x="50" y="575" width="1100" height="170" rx="16" class="proof"/><text x="600" y="625" class="proof-value" text-anchor="middle">45 / 45 checks passed</text><text x="600" y="662" class="proof-detail" text-anchor="middle">11 exact owned PIDs remain live · final log has 4 entries · 11 Figure-8 predicates hold</text><text x="600" y="696" class="proof-detail" text-anchor="middle">real JSON 182.498 ms · SSE 182.886 ms + [DONE]</text><text x="50" y="812" class="foot" text-anchor="start">Scope: one controlled single-host symmetric A-vs-{B,C} cut; whole HTTP RPC drop with deterministic 503, not packet-level chaos or Jepsen.</text><text x="50" y="839" class="foot" text-anchor="start">Figure 8 is a deterministic five-server algorithmic replay over production commit/vote predicates, not a live five-node runtime.</text><text x="50" y="866" class="foot" text-anchor="start">No latency/reorder/half-open model, arbitrary partitions, membership changes, multi-host network, formal verification, or proxy-management authentication.</text></svg>