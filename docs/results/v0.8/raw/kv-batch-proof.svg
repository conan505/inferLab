<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title description">
<title id="title">InferLab v0.8 KV cache and continuous batching proof</title>
<desc id="description">Deterministic decoder work before and after KV caching, request throughput and p95 latency across concurrency, and aligned sequence lanes showing continuous scheduler backfill.</desc>
<style>
        :root { color-scheme: light dark; }
        svg { --bg: #f8fafc; --fg: #172033; --muted: #596579;
              --grid: #d6dce5; --panel: #ffffff; --blue: #2563eb;
              --green: #16835b; --orange: #d97706; --purple: #7c3aed; }
        @media (prefers-color-scheme: dark) {
          svg { --bg: #111827; --fg: #eef2f7; --muted: #a9b4c4;
                --grid: #374151; --panel: #182235; --blue: #77a7ff;
                --green: #55d6a2; --orange: #ffb454; --purple: #b794f6; }
        }
        .background { fill: var(--bg); }
        .panel { fill: var(--panel); stroke: var(--grid); stroke-width: 1; }
        .title { fill: var(--fg); font: 600 26px system-ui, sans-serif; }
        .subtitle { fill: var(--muted); font: 14px system-ui, sans-serif; }
        .heading { fill: var(--fg); font: 600 17px system-ui, sans-serif; }
        .label { fill: var(--fg); font: 13px system-ui, sans-serif; }
        .small { fill: var(--muted); font: 11px system-ui, sans-serif; }
        .tiny { fill: var(--muted); font: 10px system-ui, sans-serif; }
        .value { fill: var(--fg); font: 600 12px ui-monospace, monospace; }
        .grid { stroke: var(--grid); stroke-width: 1; }
        .baseline { fill: var(--orange); opacity: .78; }
        .cached { fill: var(--green); }
        .serial-line { fill: none; stroke: var(--orange); stroke-width: 2.5; }
        .continuous-line { fill: none; stroke: var(--blue); stroke-width: 2.5; }
        .serial-dot { fill: var(--orange); }
        .continuous-dot { fill: var(--blue); }
        .lane { stroke: var(--grid); stroke-width: 2; }
        .active { stroke: var(--blue); stroke-width: 6; stroke-linecap: round; opacity: .65; }
        .admit { fill: var(--green); stroke: var(--panel); stroke-width: 2; }
        .token { stroke: var(--purple); stroke-width: 2; }
        .complete { fill: var(--orange); stroke: var(--panel); stroke-width: 2; }
        </style>
<rect class="background" width="1280" height="1160"/>
<text x="52.0" y="48.0" class="title" text-anchor="start">v0.8 · KV cache and continuous batching</text>
<text x="52.0" y="74.0" class="subtitle" text-anchor="start">16/16 checks · exact token parity, deterministic work counters, and HTTP load</text>
<rect class="panel" x="42" y="98" width="1196" height="260" rx="10"/>
<text x="66.0" y="130.0" class="heading" text-anchor="start">Decoder work for ‘teach me streaming’</text>
<text x="66.0" y="151.0" class="small" text-anchor="start">Each row is normalized to its recomputation baseline; labels show exact work units.</text>
<text x="72.0" y="208.0" class="label" text-anchor="start">Query token projections</text>
<rect class="baseline" x="310" y="190" width="680" height="16" rx="3"/>
<rect class="cached" x="310" y="210" width="90.7" height="16" rx="3"/>
<text x="1002.0" y="203.0" class="value" text-anchor="start">recompute 60</text>
<text x="408.7" y="223.0" class="value" text-anchor="start">cache 8 · −86.7%</text>
<text x="72.0" y="262.0" class="label" text-anchor="start">K/V token projections</text>
<rect class="baseline" x="310" y="244" width="680" height="16" rx="3"/>
<rect class="cached" x="310" y="264" width="124.7" height="16" rx="3"/>
<text x="1002.0" y="257.0" class="value" text-anchor="start">recompute 60</text>
<text x="442.7" y="277.0" class="value" text-anchor="start">cache 11 · −81.7%</text>
<text x="72.0" y="316.0" class="label" text-anchor="start">Attention score elements</text>
<rect class="baseline" x="310" y="298" width="680" height="16" rx="3"/>
<rect class="cached" x="310" y="318" width="147.8" height="16" rx="3"/>
<text x="1002.0" y="311.0" class="value" text-anchor="start">recompute 1,104</text>
<text x="465.8" y="331.0" class="value" text-anchor="start">cache 240 · −78.3%</text>
<rect class="panel" x="42" y="378" width="1196" height="376" rx="10"/>
<text x="66.0" y="411.0" class="heading" text-anchor="start">HTTP behavior as concurrency rises</text>
<text x="66.0" y="432.0" class="small" text-anchor="start">Mixed 2/4/6/8-token limits · 24 requests per point · 3 ms delay once per scheduler batch</text>
