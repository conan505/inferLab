<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">InferLab v0.20 cryptographic service identity proof</title><desc id="desc">Two authenticated request lanes show signed Raft peer RPCs and signed gateway control reads. A rejection chart distinguishes authentication, freshness, replay, and authorization failures.</desc><defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker>
        </defs>
        <style>
          .background{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.trusted{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}.decision{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}.durable{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:1.5}.rejected{fill:#fff1f2;stroke:#f43f5e;stroke-width:1.5}.arrow{stroke:#475569;stroke-width:2;fill:none}.arrow marker{fill:#475569}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#475569}.lane{font-size:17px;font-weight:700}.box-title{font-size:15px;font-weight:700;text-anchor:middle}.box-detail{font-size:12px;fill:#475569;text-anchor:middle}.edge-label{font-size:11px;fill:#64748b;text-anchor:middle}.section{font-size:18px;font-weight:700}.label{font-size:13px}.value{font-size:13px;font-weight:700}.bar-auth{fill:#ef4444}.bar-fresh{fill:#f59e0b}.bar-replay{fill:#8b5cf6}.bar-scope{fill:#0ea5e9}.axis{stroke:#94a3b8;stroke-width:1}.proof{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}.proof-title{font-size:22px;font-weight:700;text-anchor:middle;fill:#047857}.proof-detail{font-size:13px;text-anchor:middle;fill:#065f46}.foot{font-size:12px;fill:#64748b}
        </style><rect width="1200" height="760" class="background"/><text x="50" y="54" class="title">v0.20 · cryptographic service identity</text><text x="50" y="82" class="subtitle">Leader node-a · term 1 · committed revision 2 · loopback evidence</text><text x="50" y="130" class="lane">Raft peer lane</text><rect x="50" y="150" width="200" height="72" rx="12" class="trusted"/><text x="150" y="178" class="box-title">Peer service</text><text x="150" y="201" class="box-detail">node ID + private key</text><line x1="250" y1="186" x2="310" y2="186" class="arrow" marker-end="url(#arrow)"/><text x="280" y="176" class="edge-label">signed</text><rect x="310" y="150" width="220" height="72" rx="12" class="decision"/><text x="420" y="178" class="box-title">Integrity gate</text><text x="420" y="201" class="box-detail">method · path · audience · body</text><line x1="530" y1="186" x2="590" y2="186" class="arrow" marker-end="url(#arrow)"/><text x="560" y="176" class="edge-label">fresh</text><rect x="590" y="150" width="220" height="72" rx="12" class="decision"/><text x="700" y="178" class="box-title">Scope gate</text><text x="700" y="201" class="box-detail">service ID = claimed peer ID</text><line x1="810" y1="186" x2="870" y2="186" class="arrow" marker-end="url(#arrow)"/><text x="840" y="176" class="edge-label">allowed</text><rect x="870" y="150" width="280" height="72" rx="12" class="durable"/><text x="1010" y="178" class="box-title">Raft state transition</text><text x="1010" y="201" class="box-detail">148 authorized peer RPCs observed</text><text x="50" y="275" class="lane">Gateway control-read lane</text><rect x="50" y="295" width="200" height="72" rx="12" class="trusted"/><text x="150" y="323" class="box-title">Gateway service</text><text x="150" y="346" class="box-detail">gateway-primary private key</text><line x1="250" y1="331" x2="310" y2="331" class="arrow" marker-end="url(#arrow)"/><text x="280" y="321" class="edge-label">signed GET</text><rect x="310" y="295" width="220" height="72" rx="12" class="decision"/><text x="420" y="323" class="box-title">Request gate</text><text x="420" y="346" class="box-detail">signature · time · nonce</text><line x1="530" y1="331" x2="590" y2="331" class="arrow" marker-end="url(#arrow)"/><text x="560" y="321" class="edge-label">scoped</text><rect x="590" y="295" width="220" height="72" rx="12" class="decision"/><text x="700" y="323" class="box-title">Audience + allowlist</text><text x="700" y="346" class="box-detail">exact node + gateway role</text><line x1="810" y1="331" x2="870" y2="331" class="arrow" marker-end="url(#arrow)"/><text x="840" y="321" class="edge-label">route</text><rect x="870" y="295" width="280" height="72" rx="12" class="durable"/><text x="1010" y="323" class="box-title">Signed route → worker</text><text x="1010" y="346" class="box-detail">13 authorized reads · r2</text><text x="50" y="424" class="section">Rejected requests at the leader</text><line x1="250" y1="455" x2="250" y2="618" class="axis"/><text x="50" y="484" class="label">authentication</text><rect x="250" y="468" width="420" height="22" rx="4" class="bar-auth"/><text x="682" y="484" class="value">3</text><text x="50" y="522" class="label">freshness</text><rect x="250" y="506" width="140" height="22" rx="4" class="bar-fresh"/><text x="402" y="522" class="value">1</text><text x="50" y="560" class="label">replay</text><rect x="250" y="544" width="140" height="22" rx="4" class="bar-replay"/><text x="402" y="560" class="value">1</text><text x="50" y="598" class="label">authorization</text><rect x="250" y="582" width="280" height="22" rx="4" class="bar-scope"/><text x="542" y="598" class="value">2</text><rect x="740" y="430" width="410" height="190" rx="14" class="proof"/><text x="945" y="476" class="proof-title">20 / 20 checks passed</text><text x="945" y="510" class="proof-detail">unknown · stale · replay · tamper · wrong scope rejected</text><text x="945" y="540" class="proof-detail">gateway identity: gateway-primary · route key: route-2026-b</text><text x="945" y="570" class="proof-detail">real request 185.707 ms · SSE 186.723 ms + DONE</text><text x="50" y="676" class="section">What signatures add</text><text x="50" y="704" class="label">Identity · request integrity · bounded freshness · process-local replay defense · endpoint scope</text><text x="50" y="733" class="foot">What they do not add: encryption, hostname authentication, durable nonce history, or automatic key rotation.</text></svg>