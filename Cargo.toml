[workspace]
members = ["batch-queue", "control-auth", "control-plane", "fake-worker", "gateway", "model-artifacts", "observability", "service-auth", "transport-security", "trust-distributor", "trust-renewer", "worker"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.31.0"

[workspace.dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
futures-util = "0.3.31"
libc = "0.2.187"
prometheus-client = "0.25.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rustls = { version = "0.23.42", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pemfile = "2.2.0"
safetensors = { version = "0.8.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.53", features = ["full"] }
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
x509-parser = "0.18.1"
