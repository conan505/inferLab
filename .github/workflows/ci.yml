name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-quality:
    name: Rust formatting and lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  workspace-tests:
    name: Rust and C++ workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CXX: g++
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Report the native compiler
        run: g++ --version

      - name: Run the workspace tests
        run: cargo test --workspace --all-targets --locked

  script-quality:
    name: Python and shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the Python tools
        run: python -m compileall -q benchmarks

      - name: Parse the proof scripts
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - name: Parse the interview deployment scripts
        run: |
          for file in deploy/interview/*.sh; do
            sh -n "$file"
          done

      - name: Validate the interview Compose topology
        run: docker compose --file deploy/interview/compose.yaml config --quiet

  container-image:
    name: Interview container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: inferlab-interview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the complete interview topology
        env:
          INFERLAB_IMAGE_TAG: ci
          INFERLAB_SKIP_BUILD: "1"
        run: |
          set -euo pipefail
          cleanup() {
            ./deploy/interview/stop.sh --purge-data
          }
          trap cleanup EXIT

          ./deploy/interview/start.sh

          prometheus_total="$(
            curl --fail --silent --noproxy '*' --get \
              --data-urlencode 'query=count(up{job="inferlab-interview"})' \
              http://127.0.0.1:9090/api/v1/query
          )"
          prometheus_up="$(
            curl --fail --silent --noproxy '*' --get \
              --data-urlencode 'query=count(up{job="inferlab-interview"} == 1)' \
              http://127.0.0.1:9090/api/v1/query
          )"
          python3 -c '
          import json
          import sys
          for encoded in sys.argv[1:]:
              payload = json.loads(encoded)
              result = payload.get("data", {}).get("result", [])
              assert payload.get("status") == "success"
              assert len(result) == 1
              assert len(result[0].get("value", [])) == 2
              assert float(result[0]["value"][1]) == 6.0
          ' "$prometheus_total" "$prometheus_up"

          unauthorized_status="$(
            curl --silent --noproxy '*' --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8080/internal/workers
          )"
          test "$unauthorized_status" = "401"

          stream="$(
            curl --fail --silent --noproxy '*' --no-buffer \
              --header 'authorization: Bearer inferlab-interview-local-key' \
              --header 'content-type: application/json' \
              --data '{"model":"inferlab-tiny","stream":true,"temperature":0,"speculative_tokens":2,"max_tokens":8,"messages":[{"role":"user","content":"online trust route"}]}' \
              http://127.0.0.1:8080/v1/chat/completions
          )"
          grep --fixed-strings --quiet '"content":"InferLab"' <<<"$stream"
          grep --fixed-strings --quiet 'data: [DONE]' <<<"$stream"

  v026-proof:
    name: v0.26 exact-process observability proof
    needs:
      - rust-quality
      - workspace-tests
      - script-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CXX: g++
      INFERLAB_V26_OUTPUT_DIR: ci-artifacts/v0.26
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Run the bounded-cardinality observability proof
        run: ./scripts/proof-v0.26.sh

      - name: Retain proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.26-proof-${{ github.run_id }}
          path: ci-artifacts/v0.26
          if-no-files-found: warn
          retention-days: 14
