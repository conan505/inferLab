# Strict local rehearsal override for a future hosted public edge. This file
# deliberately requires every deployment credential. It still publishes only
# the public listener on host loopback; it does not provide internet hosting or
# TLS termination.
services:
  control-a:
    environment:
      INFERLAB_CONTROL_SIGNING_KEY_ID: ${INFERLAB_CONTROL_SIGNING_KEY_ID:?set INFERLAB_CONTROL_SIGNING_KEY_ID for hosted-edge mode}
      INFERLAB_CONTROL_SIGNING_PRIVATE_KEY_B64: ${INFERLAB_CONTROL_SIGNING_PRIVATE_KEY_B64:?set INFERLAB_CONTROL_SIGNING_PRIVATE_KEY_B64 for hosted-edge mode}

  control-b:
    environment:
      INFERLAB_CONTROL_SIGNING_KEY_ID: ${INFERLAB_CONTROL_SIGNING_KEY_ID:?set INFERLAB_CONTROL_SIGNING_KEY_ID for hosted-edge mode}
      INFERLAB_CONTROL_SIGNING_PRIVATE_KEY_B64: ${INFERLAB_CONTROL_SIGNING_PRIVATE_KEY_B64:?set INFERLAB_CONTROL_SIGNING_PRIVATE_KEY_B64 for hosted-edge mode}

  control-c:
    environment:
      INFERLAB_CONTROL_SIGNING_KEY_ID: ${INFERLAB_CONTROL_SIGNING_KEY_ID:?set INFERLAB_CONTROL_SIGNING_KEY_ID for hosted-edge mode}
      INFERLAB_CONTROL_SIGNING_PRIVATE_KEY_B64: ${INFERLAB_CONTROL_SIGNING_PRIVATE_KEY_B64:?set INFERLAB_CONTROL_SIGNING_PRIVATE_KEY_B64 for hosted-edge mode}

  gateway:
    environment:
      INFERLAB_PUBLIC_EDGE_MODE: hosted
      INFERLAB_PUBLIC_API_KEYS: ${INFERLAB_PUBLIC_API_KEYS:?set INFERLAB_PUBLIC_API_KEYS for hosted-edge mode}
      INFERLAB_OPERATOR_API_KEY: ${INFERLAB_OPERATOR_API_KEY:?set INFERLAB_OPERATOR_API_KEY for hosted-edge mode}
      INFERLAB_OPERATOR_BIND: ${INFERLAB_OPERATOR_BIND:?set INFERLAB_OPERATOR_BIND for hosted-edge mode}
      INFERLAB_CONTROL_TRUSTED_KEYS: ${INFERLAB_CONTROL_TRUSTED_KEYS:?set INFERLAB_CONTROL_TRUSTED_KEYS for hosted-edge mode}
      INFERLAB_PUBLIC_MAX_MESSAGES: ${INFERLAB_PUBLIC_MAX_MESSAGES:-32}
      INFERLAB_PUBLIC_MAX_PROMPT_BYTES: ${INFERLAB_PUBLIC_MAX_PROMPT_BYTES:-16384}
      INFERLAB_PUBLIC_MAX_OUTPUT_TOKENS: ${INFERLAB_PUBLIC_MAX_OUTPUT_TOKENS:-256}
      INFERLAB_PUBLIC_RATE_REQUESTS_PER_MINUTE: ${INFERLAB_PUBLIC_RATE_REQUESTS_PER_MINUTE:-60}
      INFERLAB_PUBLIC_RATE_BURST: ${INFERLAB_PUBLIC_RATE_BURST:-4}
    expose:
      # Private Compose-network listener only; never published to the host.
      - "8081"
